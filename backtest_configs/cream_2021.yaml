# Cream Finance exploit, 2021-10-27
# ---------------------------------------------------------------------------
# Cream's lending markets were drained for ~$130M after an attacker
# manipulated a yUSD-related Chainlink price source. The exploit hinged on
# a price spike well outside any normal stablecoin-pegged feed's range.
#
# Why 5% (500 bps) is the threshold:
#   yUSD targets a ~$1 peg. A 5% deviation in a single update is realistic
#   alarm territory for any stablecoin-pegged feed — it is a tight bound a
#   real customer would set and not a tuned-for-the-test value. Looser
#   thresholds (e.g. 10%) would still catch the historical spike but match
#   what real ops teams configure for stable-to-stable feeds.
#
# IMPORTANT: aggregator_address below is a placeholder. Cream pulled price
# from multiple sources at the time and the precise on-chain Chainlink
# aggregator that was manipulated needs verification against Etherscan
# before running this backtest. Replace the TODO address with the verified
# yUSD/USD aggregator that was active in the [start_block, end_block] range.

chain: ethereum
start_block: 13499500
end_block: 13499600
output_path: ./backtest_reports/cream_2021.jsonl
max_block_range: 100

customers:
  - id: 1
    key: "cream_research"
    display_name: "Cream Finance Research Backtest"

rules:
  oracle_update:
    - customer_id: 1
      chain_id: 1
      # The yUSD price aggregator that was manipulated during the exploit.
      # Verify this address against Etherscan before running — Cream used
      # multiple oracle sources and the precise feed needs research.
      # Look at: https://etherscan.io/address/<cream_yusd_oracle> at the
      # block range above to find the correct aggregator.
      aggregator_address: "0xTODO_VERIFY_yUSD_AGGREGATOR_ADDRESS"
      feed_label: "yUSD/USD"
      spike_threshold_bps: 500
      decimals: 8

  large_transfer: []
  governance: []
  mint_burn: []
  approval: []
  bridge_transfers: []

bridge_contracts: []
